name: coloring_app
description: A simple coloring book application for children.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mobile_ads: ^3.0.0
  provider: ^6.0.5
  path_drawing: ^1.0.1
  xml: ^6.3.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/animals/
    - assets/images/flowers/
    - assets/images/items/
    - assets/images/people/
